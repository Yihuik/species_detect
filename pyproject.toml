[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "metadata-agent-workflow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "Pillow>=10,<13", "requests>=2.31,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
metadata-agent = "agentized_workflow.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
